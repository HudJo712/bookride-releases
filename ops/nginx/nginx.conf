worker_processes auto;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  include /etc/nginx/conf.d/active-upstream.conf;

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://app_backend/;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://app_backend/;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  server {
    listen 8081 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      set $upstream_jenkins jenkins.;
      proxy_pass http://$upstream_jenkins:8080;
    }
  }

  server {
    listen 3000 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      set $upstream_grafana grafana.;
      proxy_pass http://$upstream_grafana:3000;
    }
  }

  server {
    listen 5601 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      set $upstream_kibana kibana.;
      proxy_pass http://$upstream_kibana:5601;
    }
  }

  server {
    listen 9200 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      set $upstream_elasticsearch elasticsearch.;
      proxy_pass http://$upstream_elasticsearch:9200;
    }
  }

  server {
    listen 9090 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      set $upstream_prometheus prometheus.;
      proxy_pass http://$upstream_prometheus:9090;
    }
  }
}
