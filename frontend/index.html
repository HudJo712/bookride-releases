<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book & Ride Access</title>
  <link rel="stylesheet" href="./vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script defer src="auth.js?v=4"></script>
</head>
<body data-bs-theme="dark">
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <div class="screen">
    <header class="auth-hero">
      <div class="auth-hero-inner container">
        <p class="eyebrow">Book & Ride Access</p>
        <h1>Sign in to continue</h1>
        <p class="subhead">Admin credentials go to the control room. Guest accounts land in the overview dashboard.</p>
      </div>
    </header>
    <main class="auth-grid container">
      <section class="card br-card auth-card">
        <div class="br-card-header">
          <h2>Sign in</h2>
          <p>Use your credentials to access the right dashboard.</p>
        </div>
        <form id="login-form" class="stack">
          <div class="inline">
            <label>
              Email
              <input class="form-control" type="email" name="email" required />
            </label>
            <label>
              Password
              <input class="form-control" type="password" name="password" required />
            </label>
          </div>
          <label>
            Base URL
            <input class="form-control" type="text" id="auth-base-url" name="baseUrl" placeholder="/api" required />
          </label>
          <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <div class="auth-divider">New here?</div>
        <form id="register-form" class="stack">
          <div class="inline">
            <label>
              Email
              <input class="form-control" type="email" name="email" required />
            </label>
            <label>
              Password
              <input class="form-control" type="password" name="password" required />
            </label>
          </div>
          <p class="subhead">New accounts are guest-only. Control room access is assigned by admins.</p>
          <button class="btn btn-outline-light" type="submit">Create account</button>
        </form>
        <div class="auth-message" id="auth-message">Sign in to continue.</div>
      </section>
    </main>
  </div>

  <script src="./vendor/bootstrap/bootstrap.bundle.min.js"></script>
</body>
</html>
